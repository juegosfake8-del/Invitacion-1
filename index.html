<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVIVAMIENTO | Este 24 de octubre</title>
<style>
html, body {
  margin: 0;
  height: 100%;
  background: #050303; /* fondo oscuro */
  font-family: Arial, sans-serif;
  color: white;
}

.pantalla {
  width: 100%;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  position: relative;
  overflow: hidden;
}

/* Fondo nebuloso azul */
.fondo {
  position: absolute;
  top: -50%; left: -50%;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 30%, rgba(0,120,255,0.25), transparent 70%),
              radial-gradient(circle at 70% 70%, rgba(0,60,150,0.25), transparent 70%),
              radial-gradient(circle at 50% 20%, rgba(0,180,255,0.2), transparent 70%),
              radial-gradient(circle at 20% 80%, rgba(50,150,255,0.2), transparent 70%);
  animation: moverNeblina 20s ease-in-out infinite alternate; /* movimiento más notorio */
  filter: blur(80px); /* difumina mucho más */
  z-index: 0;
}

@keyframes moverNeblina {
  0%   { transform: translate(0,0) scale(1); }
  50%  { transform: translate(25%, -25%) scale(1.2); } /* movimiento más amplio */
  100% { transform: translate(-15%, 15%) scale(1); }
}

.contenido {
  position: relative;
  z-index: 1; /* asegura que el texto quede encima */
}

.aviso-linea {
  font-size: clamp(20px, 6vw, 32px);
  font-weight: 800;
  letter-spacing: 3px;
  text-shadow: 0 0 8px rgba(255,255,255,.3);
}

.aviso-titulo {
  font-size: clamp(28px, 8vw, 48px);
  font-weight: 950;
  letter-spacing: -1.5px;
  margin-top: 10px;
  text-shadow: 0 0 12px rgba(30,120,255,.8);
}

.aviso-pronto {    
  font-size: clamp(18px, 5.5vw, 28px);
  font-weight: 900;
  color: #ffb15c;
  margin-top: 20px;
  text-shadow: 0 0 12px rgba(255,120,20,.7);
}
</style>
</head>
<body>
  <div class="pantalla">
    <div class="fondo"></div>
    <div class="contenido">
      <div class="aviso-linea">CULTO DE</div>
      <div class="aviso-titulo">🔥AVIVAMIENTO🔥</div>
      <div class="aviso-pronto">Este 24 de octubre a las 5:00 pm</div>
    </div>
  </div>
</body>
</html>
